<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字化衍生工厂</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./pics/1.png');
            background-size: cover;
            background-position: center;
            animation: panBackground 30s infinite linear;
            z-index: -1;
            opacity: 0.7;
        }
        
        @keyframes panBackground {
            0% {
                background-position: 0% 0%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
            100% {
                background-position: 0% 0%;
            }
        }
        
        .title {
            font-size: 4rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7),
                         0 0 20px rgba(0, 255, 255, 0.5),
                         0 0 30px rgba(0, 255, 255, 0.3);
            margin-bottom: 3rem;
            transform-style: preserve-3d;
            animation: rotateTitle 10s infinite linear;
        }
        
        @keyframes rotateTitle {
            0% {
                transform: perspective(1000px) rotateY(0deg);
            }
            100% {
                transform: perspective(1000px) rotateY(360deg);
            }
        }
        
        .menu {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }
        
        .menu-item {
            position: relative;
            font-size: 1.5rem;
            color: #fff;
            padding: 0.8rem 2rem;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 1;
        }
        
        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.4), transparent);
            transition: all 0.5s ease;
            z-index: -1;
        }
        
        .menu-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
            color: #0ff;
        }
        
        .menu-item:hover::before {
            left: 100%;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <h1 class="title">数字化衍生工厂</h1>
    <div class="menu">
        <div class="menu-item" onclick="window.location.href='choice.html'">开始体验</div>
        <div class="menu-item">设置</div>
        <div class="menu-item">更多</div>
    </div>

    <script>
        // 如果需要添加点击事件，可以在这里添加
        document.querySelectorAll('.menu-item').forEach(item => {
            //item.addEventListener('click', function() {
              //  alert('你点击了: ' + this.textContent);
            //});
        });
    </script>
</body>
</html>
